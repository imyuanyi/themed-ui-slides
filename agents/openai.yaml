interface:
  display_name: "Themed UI Slides"
  short_description: "Confirm style, then craft subtle UI accents"
  default_prompt: "Use $themed-ui-slides with $frontend-slides. Assume I may have no reference image: first infer three fitting palette and art-direction options from my presentation topic, audience, and tone, using frontend-slides themes as inspiration but not a limit. Show three lightweight title-slide previews by default and ask me to confirm the Style Lock. Only after I confirm, check image-generation access and request any required delegation authorization. Require a dedicated UI-art subagent to create a varied, animation-ready, Figma-friendly themed UI kit with a clear asset manifest and several recognizable topic-linked components that pass the swap test, not only generic cards or lines; keep the main HTML typography and message dominant."
